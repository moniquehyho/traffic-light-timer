<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Timer Control</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;  /* the visible height, between the phone's address bar and toolbar */
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #1e1e24;
    color: #f2f2f2;
    display: flex;
    flex-direction: column;
    transition: background 0.3s;
  }

  /* Top of the page: clear colour, then the time and buttons. Settings and history follow. */
  .hero { flex: 1; display: flex; flex-direction: column; }
  .colour-area { flex: 1; min-height: 30vh; }  /* left clear so the colour shows cleanly */

  /* See-through panel: the screen colour shows behind everything, and a soft shadow keeps
     white text readable on bright colours. */
  .panel {
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 14px max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.55);
  }
  .setup-panel { padding-top: 14px; padding-bottom: max(20px, env(safe-area-inset-bottom)); }
  .scroll-hint { display: none; text-align: center; font-size: 0.8rem; opacity: 0.8; }
  .clock { text-align: center; }
  #time { font-size: 3rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
  #status { font-size: 0.9rem; min-height: 1.3em; }

  /* While the timer runs: the first screen is just the colour, the time and the buttons,
     fitted to the visible height and sized to the phone (smaller on short or landscape
     screens). Settings and history are still there below; scroll down to reach them. */
  body.compact .hero { flex: none; min-height: 100vh; min-height: 100dvh; }
  body.compact .colour-area { min-height: 0; }
  body.compact .hero .panel { padding-bottom: max(3vh, 12px, env(safe-area-inset-bottom)); }
  body.compact .scroll-hint { display: block; }
  body.compact #time { font-size: clamp(2.5rem, min(18vw, 11dvh), 6rem); }
  body.compact .buttons button { padding: clamp(10px, 2.2dvh, 18px) 4px; font-size: clamp(1rem, 2.4dvh, 1.3rem); }

  input, button {
    font: inherit;
    font-size: 1.05rem;
    padding: 12px;
    border-radius: 10px;
    border: 1.5px solid rgba(255, 255, 255, 0.6);
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    text-shadow: inherit;
  }
  input:disabled { opacity: 0.6; }
  button { cursor: pointer; font-weight: 600; }
  button:disabled { opacity: 0.35; cursor: default; }
  button.primary { background: rgba(255, 255, 255, 0.3); border-color: #fff; }
  button.stop { background: rgba(0, 0, 0, 0.25); border-color: #fff; }
  .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .buttons button { padding-left: 4px; padding-right: 4px; }

  .fields { display: flex; flex-direction: column; gap: 8px; }
  .field { display: grid; grid-template-columns: 1fr 96px 48px; gap: 8px; align-items: center; font-size: 0.95rem; }
  .field input[type="number"] { width: 100%; padding: 10px; }
  input[type="color"] { width: 48px; height: 44px; padding: 3px; cursor: pointer; }
  .field input.invalid { border-color: #ff6b6b; box-shadow: 0 0 0 1.5px #ff6b6b; }
  .error { color: #ffb3b3; font-size: 0.9rem; }

  .palettes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .palettes button {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
    font-size: 0.85rem;
    font-weight: 500;
  }
  .palettes button.active { border-color: #fff; box-shadow: 0 0 0 1.5px #fff; background: rgba(255, 255, 255, 0.3); }
  .dot { box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.7); }
  .dot { width: 14px; height: 14px; border-radius: 50%; }

  .section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .section-head h2 { margin: 0; font-size: 0.95rem; font-weight: 600; }
  .section-head button { font-size: 0.85rem; padding: 6px 12px; font-weight: 500; }
  .history table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 0.95rem; }
  .history th, .history td { text-align: left; padding: 6px 4px; border-bottom: 1px solid rgba(255, 255, 255, 0.35); }
  .history th { font-weight: 500; opacity: 0.85; }
  .history .empty { opacity: 0.75; }

  /* Shown inside the big screen's "Show full panel" box: no background of its own (the big
     screen's colour shows through), no clear colour area, smaller sizes, never minimised. */
  body.embed { min-height: 0; background: transparent; transition: none; }
  body.embed .colour-area, body.embed .scroll-hint { display: none; }
  body.embed .panel { padding: 0 4px; gap: 10px; }
  body.embed .setup-panel { padding: 10px 4px 4px; }
  body.embed #time { font-size: 2.2rem; }
  body.embed input, body.embed button { font-size: 0.95rem; padding: 8px; }
  body.embed .buttons button { padding-left: 2px; padding-right: 2px; }
  body.embed .field { grid-template-columns: 1fr 72px 40px; font-size: 0.9rem; }
  body.embed input[type="color"] { width: 40px; height: 36px; padding: 2px; }
  body.embed .palettes button { padding: 6px 8px; font-size: 0.8rem; }
  body.embed .history table { font-size: 0.85rem; }
</style>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="timer-core.js?v=5"></script>
</head>
<body>
  <div class="hero">
    <div class="colour-area"></div>
    <div class="panel">
      <div class="clock">
        <div id="time">00:00</div>
        <div id="status">Connecting…</div>
      </div>
      <div class="buttons">
        <button class="primary" id="startBtn" disabled>Start</button>
        <button id="pauseBtn" disabled>Pause</button>
        <button class="stop" id="stopBtn" disabled>Stop</button>
        <button id="resetBtn" disabled>Reset</button>
      </div>
      <div class="scroll-hint">Scroll down for settings and history</div>
    </div>
  </div>

  <div class="panel setup-panel">
    <div class="fields setup">
      <div class="field"><label for="greenMins">Green at (min)</label>
        <input type="number" id="greenMins" min="0" step="any" inputmode="decimal" value="5">
        <input type="color" id="greenColour" aria-label="Green colour"></div>
      <div class="field"><label for="amberMins">Amber at (min)</label>
        <input type="number" id="amberMins" min="0" step="any" inputmode="decimal" value="6">
        <input type="color" id="amberColour" aria-label="Amber colour"></div>
      <div class="field"><label for="redMins">Red at (min)</label>
        <input type="number" id="redMins" min="0" step="any" inputmode="decimal" value="7">
        <input type="color" id="redColour" aria-label="Red colour"></div>
      <div id="minutesError" class="error" role="alert" hidden></div>
    </div>

    <div class="setup">
      <div class="section-head"><h2>Screen colours</h2></div>
      <div class="palettes" id="palettes"></div>
    </div>

    <div class="history setup">
      <div class="section-head">
        <h2>Timer history</h2>
        <button id="clearHistoryBtn" disabled>Clear</button>
      </div>
      <table>
        <thead><tr><th>#</th><th>Timer</th><th>Stopped at</th></tr></thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
  </div>

<script>
  const MINUTES_KEY = 'trafficLightTimerMinutes';
  // Opened by the big screen's "Show full panel" button (inside its page, not on a phone).
  const embedded = new URLSearchParams(location.search).has('embed') && window.parent !== window;
  document.body.classList.toggle('embed', embedded);
  const KEYS = ['green', 'amber', 'red'];
  const timeEl = document.getElementById('time');
  const statusEl = document.getElementById('status');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const stopBtn = document.getElementById('stopBtn');
  const resetBtn = document.getElementById('resetBtn');
  const clearBtn = document.getElementById('clearHistoryBtn');
  const minuteInputs = Object.fromEntries(KEYS.map(k => [k, document.getElementById(k + 'Mins')]));
  const colourInputs = Object.fromEntries(KEYS.map(k => [k, document.getElementById(k + 'Colour')]));
  const palettesEl = document.getElementById('palettes');
  const historyBody = document.getElementById('historyBody');

  let state = null;      // latest timer state (from the big screen, or this phone's own timer)
  let receivedAt = 0;    // performance.now() when it arrived
  let send = () => {};   // sends a command to whichever timer this phone controls

  function setState(s) {
    state = s;
    receivedAt = performance.now();
    renderControls();
  }

  // Remember this phone's last minute settings.
  const savedMinutes = loadJson(MINUTES_KEY, null);
  if (savedMinutes) KEYS.forEach(k => { if (savedMinutes[k] != null) minuteInputs[k].value = savedMinutes[k]; });

  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`); }

  // --- Controls ---

  // Check the minutes as they're typed: green before amber before red. Highlights the boxes
  // to fix and keeps Start off until they're right.
  const minutesErrorEl = document.getElementById('minutesError');
  let minutesProblem = null;
  function readMinutes() {
    return Object.fromEntries(KEYS.map(k => [k, parseFloat(minuteInputs[k].value)]));
  }
  function validateMinutes() {
    minutesProblem = checkMinutes(readMinutes());
    KEYS.forEach(k => minuteInputs[k].classList.toggle('invalid', !!minutesProblem && minutesProblem.bad.includes(k)));
    minutesErrorEl.hidden = !minutesProblem;
    minutesErrorEl.textContent = minutesProblem ? minutesProblem.message : '';
  }
  KEYS.forEach(k => minuteInputs[k].addEventListener('input', () => { validateMinutes(); renderControls(); }));

  startBtn.addEventListener('click', () => {
    validateMinutes();
    if (minutesProblem) return renderControls();
    const minutes = readMinutes();
    saveJson(MINUTES_KEY, minutes);
    send({ cmd: 'start', minutes });
  });
  pauseBtn.addEventListener('click', () => send({ cmd: state && state.paused ? 'resume' : 'pause' }));
  stopBtn.addEventListener('click', () => send({ cmd: 'stop' }));
  resetBtn.addEventListener('click', () => send({ cmd: 'reset' }));
  clearBtn.addEventListener('click', () => {
    if (confirm('Clear the timer history?')) send({ cmd: 'clearHistory' });
  });

  function sendPalette(palette) {
    send({ cmd: 'palette', palette: { green: palette.green, amber: palette.amber, red: palette.red } });
  }
  palettesEl.innerHTML = Object.entries(PALETTES).map(([id, p]) =>
    `<button type="button" data-palette="${id}">` +
    KEYS.map(k => `<span class="dot" style="background:${p[k]}"></span>`).join('') +
    `${p.name}</button>`).join('');
  palettesEl.addEventListener('click', e => {
    const btn = e.target.closest('button[data-palette]');
    if (btn && !btn.disabled) sendPalette(PALETTES[btn.dataset.palette]);
  });
  KEYS.forEach(k => colourInputs[k].addEventListener('input', () => {
    sendPalette(Object.fromEntries(KEYS.map(key => [key, colourInputs[key].value])));
  }));

  function renderControls() {
    const connected = !!state;
    const running = connected && state.running;
    const paused = connected && !!state.paused;
    const active = running || paused;  // a timer is on: its minutes are locked
    // Minimised (time and buttons fill the screen) while the timer runs; pausing or stopping
    // brings the full panel back.
    const compact = running && !embedded;
    if (compact && !document.body.classList.contains('compact')) window.scrollTo(0, 0);
    document.body.classList.toggle('compact', compact);
    startBtn.disabled = !connected || active || !!minutesProblem;
    pauseBtn.disabled = !active;
    pauseBtn.textContent = paused ? 'Resume' : 'Pause';
    pauseBtn.classList.toggle('primary', paused);
    stopBtn.disabled = !active;
    resetBtn.disabled = !connected;
    clearBtn.disabled = !connected || !state.history || !state.history.length;
    KEYS.forEach(k => {
      minuteInputs[k].disabled = !connected || active;
      if (active) minuteInputs[k].value = +(state.triggers[k] / 60000).toFixed(2);  // the running timer's settings
      colourInputs[k].disabled = !connected;
      if (connected && document.activeElement !== colourInputs[k]) colourInputs[k].value = state.palette[k];
    });
    palettesEl.querySelectorAll('button').forEach(btn => {
      const p = PALETTES[btn.dataset.palette];
      btn.disabled = !connected;
      btn.classList.toggle('active', connected && KEYS.every(k => p[k].toLowerCase() === state.palette[k].toLowerCase()));
    });

    const history = (state && state.history) || [];
    historyBody.innerHTML = history.length
      ? history.map((h, i) => `<tr><td>${i + 1}</td><td>${fmtDuration(h.ms)}</td><td>${escapeHtml(h.stoppedAt)}</td></tr>`)
          .reverse().join('')
      : '<tr><td colspan="3" class="empty">No timers yet.</td></tr>';
  }

  // --- Which timer does this phone control? ---

  const timerId = new URLSearchParams(location.search).get('id');

  if (embedded) {
    // Inside the big screen's panel: the big screen runs the timer; talk to it directly.
    send = msg => parent.postMessage({ tlt: 'command', msg }, '*');
    addEventListener('message', e => {
      if (e.source === parent && e.data && e.data.tlt === 'state') setState(e.data.state);
    });
    // Tell the big screen how tall the panel is, so its box fits it.
    new ResizeObserver(() => parent.postMessage({ tlt: 'height', h: document.body.scrollHeight }, '*'))
      .observe(document.body);
    parent.postMessage({ tlt: 'ready' }, '*');
  } else if (!timerId) {
    // Opened on its own (not from a QR code): this phone is the timer screen and the remote.
    const timer = createTimer();
    send = msg => { timer.command(msg); setState(timer.state()); };
    setState(timer.state());
  } else if (typeof Peer === 'undefined') {
    statusEl.textContent = 'Couldn’t load the pairing tool. Check your internet and reload.';
  } else {
    // Opened from the QR code: connect straight to that big screen and control it.
    let peer = new Peer();
    let conn = null;
    let retryTimer = null;

    const retry = () => {
      if (retryTimer) return;  // close and error often fire together; retry once
      state = null;
      renderControls();
      statusEl.textContent = 'Lost connection to the timer. Reconnecting…';
      retryTimer = setTimeout(() => { retryTimer = null; connect(); }, 3000);
    };

    const connect = () => {
      if (peer.disconnected) peer.reconnect();
      const old = conn;
      const c = conn = peer.connect(timerId, { reliable: true });
      if (old) old.close();
      c.on('data', setState);
      c.on('close', () => { if (c === conn) retry(); });  // ignore the old connection closing
      c.on('error', () => { if (c === conn) retry(); });
    };

    send = msg => { if (conn && conn.open) conn.send(msg); };
    peer.on('open', connect);
    peer.on('error', err => {
      // 'peer-unavailable' means the big screen isn't open (yet), so keep trying.
      if (err.type === 'peer-unavailable') retry();
      else statusEl.textContent = 'Can’t reach the pairing service. Retrying…';
    });
    peer.on('disconnected', () => setTimeout(() => peer.reconnect(), 2000));
  }

  function render() {
    if (!state) return;
    const elapsed = state.elapsedMs + (state.running ? performance.now() - receivedAt : 0);
    timeEl.textContent = fmtDuration(elapsed);
    statusEl.textContent = state.running ? ''
      : state.paused ? 'Paused'
      : state.stopped ? 'Stopped – time saved in the history'
      : 'Ready – set the minutes and press Start';
    if (!embedded) document.body.style.background = phaseColour(state.running ? phaseAt(elapsed, state.triggers) : null, state.palette);
  }

  validateMinutes();
  renderControls();
  setInterval(render, 100);
</script>
</body>
</html>
