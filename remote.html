<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timer</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #1e1e24;
    color: #f2f2f2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    transition: background 0.3s;
  }
  #time { font-size: 24vw; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; }
  #status { font-size: 1.3rem; color: #ccc; min-height: 1.5em; }
  body.phase-green { background: #0f3d1d; }
  body.phase-amber { background: #4a3300; }
  body.phase-red   { background: #4a0f0f; }
</style>
</head>
<body>
  <div id="time">00:00</div>
  <div id="status">Connecting…</div>

<script>
  const FLASH_MS = 6000;
  const timeEl = document.getElementById('time');
  const statusEl = document.getElementById('status');

  let server = null;     // last state from the laptop
  let receivedAt = 0;    // performance.now() when it arrived

  function pad(n) { return String(n).padStart(2, '0'); }
  function fmtDuration(ms) {
    const secs = Math.floor(ms / 1000);
    const hh = Math.floor(secs / 3600), mm = Math.floor(secs % 3600 / 60), ss = secs % 60;
    return hh ? `${hh}:${pad(mm)}:${pad(ss)}` : `${pad(mm)}:${pad(ss)}`;
  }

  function phaseAt(ms, t) {
    if (!t) return null;
    if (ms >= t.red) return 'red';
    if (ms >= t.amber && ms < t.amber + FLASH_MS) return 'amber';
    if (ms >= t.green && ms < t.green + FLASH_MS) return 'green';
    return null;
  }

  async function poll() {
    try {
      const res = await fetch('/api/state', { cache: 'no-store' });
      server = await res.json();
      receivedAt = performance.now();
    } catch {
      server = null;
      statusEl.textContent = 'Lost connection to the timer…';
    }
  }

  function render() {
    if (!server) return;
    const elapsed = server.elapsedMs + (server.running ? performance.now() - receivedAt : 0);
    timeEl.textContent = fmtDuration(elapsed);
    statusEl.textContent = server.running ? '' : (server.triggers ? 'Paused' : 'Waiting to start');
    const phase = server.running ? phaseAt(elapsed, server.triggers) : null;
    document.body.className = phase ? 'phase-' + phase : '';
  }

  poll();
  setInterval(poll, 1000);
  setInterval(render, 100);
</script>
</body>
</html>
