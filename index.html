<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traffic Light Timer</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #1e1e24;
    color: #f2f2f2;
    transition: background 0.3s;
    overflow: hidden;
  }
  body.phase-green { background: #0f3d1d; }
  body.phase-amber { background: #4a3300; }
  body.phase-red   { background: #4a0f0f; }

  .pair {
    position: fixed;
    right: 16px;
    bottom: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    font-size: 0.75rem;
    color: #aaa;
    text-align: center;
  }
  #qr { width: 110px; height: 110px; background: #fff; padding: 6px; border-radius: 6px; }
  #qr svg { display: block; width: 100%; height: 100%; }
</style>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
</head>
<body title="Double-click for full screen">
  <div class="pair">
    <div id="qr" role="img" aria-label="QR code to control the timer from your phone"></div>
    <div id="pairStatus">Setting up pairing…</div>
  </div>

<script>
  // This screen only shows the colours. Phones paired by the QR code control the timer:
  // they send commands here, and this page sends the timer state back to every phone.
  const FLASH_MS = 6000;          // how long green and amber show
  const HISTORY_KEY = 'trafficLightTimerHistory';
  const PEER_ID_KEY = 'trafficLightTimerPeerId';
  const PHONE_PAGE = location.hostname.endsWith('github.io')
    ? new URL('remote.html', location.href).href
    : 'https://moniquehyho.github.io/traffic-light-timer/remote.html';

  let triggers = null;     // { green, amber, red } in ms from start
  let accumulated = 0;     // ms counted before the current run
  let startedAt = null;    // timestamp of current run, null when paused
  let currentEntry = null; // index of this timer's history entry (updated on resume + stop)
  let history = [];
  try { history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch {}

  function pad(n) { return String(n).padStart(2, '0'); }
  function fmtClock(d) { return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }

  function elapsed() {
    return accumulated + (startedAt ? Date.now() - startedAt : 0);
  }

  function setPhase(phase) {
    document.body.className = phase ? 'phase-' + phase : '';
  }

  function phaseAt(ms) {
    if (ms >= triggers.red) return 'red';
    if (ms >= triggers.amber && ms < triggers.amber + FLASH_MS) return 'amber';
    if (ms >= triggers.green && ms < triggers.green + FLASH_MS) return 'green';
    return null;
  }

  function saveHistory() {
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch {}
  }

  // --- Timer commands (sent by phones) ---

  function start(minutes) {
    if (startedAt) return;
    if (!triggers) {
      const { green, amber, red } = minutes || {};
      if (![green, amber, red].every(v => typeof v === 'number' && v >= 0)) return;
      triggers = { green: green * 60000, amber: amber * 60000, red: red * 60000 };
      accumulated = 0;
      currentEntry = null;
    }
    startedAt = Date.now();
  }

  function stop() {
    if (!startedAt) return;
    accumulated = elapsed();
    startedAt = null;
    setPhase(null);
    const entry = { ms: accumulated, stoppedAt: fmtClock(new Date()) };
    if (currentEntry === null) {
      history.push(entry);
      currentEntry = history.length - 1;
    } else {
      history[currentEntry] = entry;
    }
    saveHistory();
  }

  function reset() {
    triggers = null;
    accumulated = 0;
    startedAt = null;
    currentEntry = null;
    setPhase(null);
  }

  function handleCommand(msg) {
    if (!msg || typeof msg !== 'object') return;
    if (msg.cmd === 'start') start(msg.minutes);
    else if (msg.cmd === 'stop') stop();
    else if (msg.cmd === 'reset') reset();
    else if (msg.cmd === 'clearHistory') { history = []; saveHistory(); }
    syncPhones();
  }

  // --- Phone pairing over WebRTC (PeerJS). PeerJS's free public server only introduces the
  // devices; commands and timer updates go device to device. ---

  const pairStatusEl = document.getElementById('pairStatus');
  const phones = new Set();
  let peer = null;

  function stateMessage() {
    return { running: !!startedAt, elapsedMs: elapsed(), triggers, history };
  }
  function syncPhones() {
    const msg = stateMessage();
    phones.forEach(conn => { if (conn.open) conn.send(msg); });
  }

  function showPhoneCount() {
    pairStatusEl.textContent = phones.size
      ? `${phones.size} phone${phones.size > 1 ? 's' : ''} connected`
      : 'Scan to control the timer';
  }

  function newPeerId() {
    return 'tlt-' + Array.from(crypto.getRandomValues(new Uint8Array(8)), b => (b % 36).toString(36)).join('');
  }

  function startPairing(id, attempt = 0) {
    if (typeof Peer === 'undefined' || typeof qrcode === 'undefined') {
      pairStatusEl.textContent = 'Phone pairing needs an internet connection.';
      return;
    }
    peer = new Peer(id);
    peer.on('open', peerId => {
      try { localStorage.setItem(PEER_ID_KEY, peerId); } catch {}  // same QR after a reload, so phones reconnect
      const qr = qrcode(0, 'M');
      qr.addData(`${PHONE_PAGE}?id=${peerId}`);
      qr.make();
      document.getElementById('qr').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
      showPhoneCount();
    });
    peer.on('connection', conn => {
      conn.on('open', () => {
        phones.add(conn);
        conn.send(stateMessage());
        showPhoneCount();
      });
      conn.on('data', handleCommand);
      conn.on('close', () => { phones.delete(conn); showPhoneCount(); });
      conn.on('error', () => { phones.delete(conn); showPhoneCount(); });
    });
    peer.on('disconnected', () => setTimeout(() => peer.reconnect(), 2000));
    peer.on('error', err => {
      if (err.type === 'unavailable-id') {
        // Right after a reload the old code can take a few seconds to free up, so retry it a few
        // times; if it's still taken (e.g. the timer is open in another tab), pick a new one.
        peer.destroy();
        if (attempt < 3) setTimeout(() => startPairing(id, attempt + 1), 3000);
        else startPairing(newPeerId());
      } else if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(err.type)) {
        pairStatusEl.textContent = 'Can’t reach the pairing service. Retrying…';
      }
    });
  }

  let savedId = null;
  try { savedId = localStorage.getItem(PEER_ID_KEY); } catch {}
  startPairing(savedId || newPeerId());
  setInterval(syncPhones, 5000);  // regular refresh keeps phones in step

  setInterval(() => {
    if (startedAt) setPhase(phaseAt(elapsed()));
  }, 100);

  document.body.addEventListener('dblclick', () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  });
</script>
</body>
</html>
